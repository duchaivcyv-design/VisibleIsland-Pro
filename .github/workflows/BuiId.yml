name: Build VisibleIsland tweak

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build .deb and Repo
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Packaging Dependencies & Setup Theos
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          brew install ldid dpkg zstd make
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          curl -fsSL https://github.com/theos/sdks/archive/master.tar.gz | tar -xz -C "$THEOS/sdks" --strip-components=1

      - name: Build package
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          export PATH="$(brew --prefix make)/libexec/gnubin:$THEOS/bin:$PATH"
          
          # Sử dụng dm.pl nội bộ của Theos để đóng gói deb trực tiếp
          # Gán FAKEROOT=true để không bị rỗng lệnh và không load dylib fakeroot lỗi của Homebrew
          make package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=rootless \
            FAKEROOT=true

      - name: Upload Repository Artifact
        uses: actions/upload-artifact@v4
        with:
          name: repository
          path: public/
