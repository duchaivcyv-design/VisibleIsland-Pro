name: Build and Package

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build-rootless:
    name: Build Rootless Package
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Build Dependencies (Ubuntu)
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          xz-utils dpkg fakeroot make cmake zstd git curl \
          llvm clang lld libplist-dev libssl-dev libpng-dev

        # Tải ldid binary từ ProcursusTeam releases
        sudo mkdir -p /usr/local/bin
        sudo curl -L \
          https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus8/ldid_linux_x86_64 \
          -o /usr/local/bin/ldid
        sudo chmod +x /usr/local/bin/ldid
        
        # Verify installation (dùng -h thay vì -v)
        ldid -h || true

        # Symlink llvm-lipo -> lipo
        LIPO_BIN=$(find /usr/bin -name "llvm-lipo*" | head -n 1)
        sudo ln -sf "$LIPO_BIN" /usr/bin/lipo

    - name: Setup Theos with iOS SDKs
      run: |
        git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
        mkdir -p "$THEOS/sdks"
        git clone --depth 1 https://github.com/theos/sdks.git /tmp/theos-sdks
        mv /tmp/theos-sdks/iPhoneOS*.sdk "$THEOS/sdks/"
        echo "===> Available SDKs:"
        ls "$THEOS/sdks/"

    - name: Build Dobby (Universal arm64 + arm64e)
      run: |
        git clone --depth 1 https://github.com/jmpews/Dobby.git /tmp/Dobby
        cd /tmp/Dobby

        # SDK mới nhất
        export SDK_PATH=$(ls -d $THEOS/sdks/iPhoneOS*.sdk | sort -V | tail -n 1)
        echo "Using SDK: $SDK_PATH"
        export CC=$(which clang)
        export CXX=$(which clang++)

        # --- Build arm64 slice ---
        mkdir build_arm64 && cd build_arm64
        cmake .. \
          -DCMAKE_SYSTEM_NAME=Darwin \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_OSX_SYSROOT="$SDK_PATH" \
          -DCMAKE_C_COMPILER="$CC" \
          -DCMAKE_CXX_COMPILER="$CXX" \
          -DCMAKE_C_FLAGS="-target arm64-apple-ios14.0" \
          -DCMAKE_CXX_FLAGS="-target arm64-apple-ios14.0" \
          -DCMAKE_BUILD_TYPE=Release \
          -DDOBBY_GENERATE_SHARED=OFF
        make -j$(nproc)
        cd ..

        # --- Build arm64e slice ---
        mkdir build_arm64e && cd build_arm64e
        cmake .. \
          -DCMAKE_SYSTEM_NAME=Darwin \
          -DCMAKE_OSX_ARCHITECTURES=arm64e \
          -DCMAKE_OSX_SYSROOT="$SDK_PATH" \
          -DCMAKE_C_COMPILER="$CC" \
          -DCMAKE_CXX_COMPILER="$CXX" \
          -DCMAKE_C_FLAGS="-target arm64e-apple-ios14.0" \
          -DCMAKE_CXX_FLAGS="-target arm64e-apple-ios14.0" \
          -DCMAKE_BUILD_TYPE=Release \
          -DDOBBY_GENERATE_SHARED=OFF
        make -j$(nproc)
        cd ..

        # --- Tìm file libdobby.a ---
        ARM64_LIB=$(find build_arm64 -name "libdobby.a" | head -n 1)
        ARM64E_LIB=$(find build_arm64e -name "libdobby.a" | head -n 1)

        # --- Ghép 2 slice thành universal binary ---
        mkdir -p "$GITHUB_WORKSPACE/vendor/dobby"
        lipo -create \
          "$ARM64_LIB" \
          "$ARM64E_LIB" \
          -output "$GITHUB_WORKSPACE/vendor/dobby/libdobby.a"
        cp include/dobby.h "$GITHUB_WORKSPACE/vendor/dobby/"

        echo "===> Dobby architectures:"
        lipo -info "$GITHUB_WORKSPACE/vendor/dobby/libdobby.a"

    - name: Compile and Package (Rootless)
      run: |
        export PATH="$THEOS/bin:$PATH"
        export THEOS_PACKAGE_SCHEME=rootless
        export FINALPACKAGE=1
        make package

    - name: Collect Packages
      run: |
        mkdir -p artifacts
        find packages/ .theos/packages/ . -maxdepth 3 -name "*.deb" -exec cp -v {} artifacts/ \; 2>/dev/null || true
        echo "===> Built packages:"
        ls -la artifacts/
        if [ -z "$(ls -A artifacts/*.deb 2>/dev/null)" ]; then
          echo "Error: Không tìm thấy file .deb nào sau khi build!"
          exit 1
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: packages-rootless
        path: artifacts/*.deb
        if-no-files-found: error
