name: Build VisibleIsland tweak

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build .deb and Repo
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Packaging Dependencies & Setup Theos
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          # Gỡ hoặc không cài fakeroot trên Homebrew để tránh xung đột dyld arm64 vs arm64e
          brew install ldid dpkg zstd make
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          curl -fsSL https://github.com/theos/sdks/archive/master.tar.gz | tar -xz -C "$THEOS/sdks" --strip-components=1

      - name: Build package
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          export PATH="$(brew --prefix make)/libexec/gnubin:$THEOS/bin:$PATH"
          # Tắt fakeroot dylib injection, Theos sẽ tự dùng phương thức native dpkg-deb/tar an toàn
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless FAKEROOT=

      - name: Make Repository Files for Sileo & Find Deb
        run: |
          mkdir -p public/debs
          
          find . -name "*.deb" ! -path "./public/*" -exec cp -v {} public/debs/ \;
          
          if [ -z "$(ls -A public/debs)" ]; then
             echo "Error: Không tìm thấy file .deb nào sau khi build!"
             exit 1
          fi
          
          cd public
          dpkg-scanpackages -m debs /dev/null > Packages
          bzip2 -9 -c Packages > Packages.bz2
          zstd -c Packages > Packages.zst
          
          cat << 'EOF' > Release
          Origin: VisibleIsland Repo
          Label: VisibleIsland Repo
          Suite: stable
          Version: 1.0
          Codename: ios
          Architectures: iphoneos-arm64
          Components: main
          Description: Repository for VisibleIsland Tweak
          EOF
          cd ..

      - name: Upload Repository Artifact
        uses: actions/upload-artifact@v4
        with:
          name: repository
          path: public/
