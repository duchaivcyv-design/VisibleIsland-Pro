name: Build and Package Theos Tweak

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build-package:
    name: Build Package (Roothide & Rootless)
    runs-on: macos-15

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        brew install ldid xz dpkg make cmake zstd

    - name: Setup Theos with iOS SDKs & RootHide Scheme
      run: |
        git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
        mkdir -p "$THEOS/sdks"
        git clone --depth 1 https://github.com/theos/sdks.git /tmp/theos-sdks
        mv /tmp/theos-sdks/iPhoneOS*.sdk "$THEOS/sdks/"
        
        # Cài đặt roothide package scheme vào Theos
        git clone --depth 1 https://github.com/roothide/Theos.git /tmp/roothide-theos
        cp -rf /tmp/roothide-theos/makefiles/package/roothide* "$THEOS/makefiles/package/" 2>/dev/null || true
        
        echo "===> Available SDKs:"
        ls "$THEOS/sdks/"

    - name: Build Dobby (Universal arm64 + arm64e)
      run: |
        git clone --depth 1 https://github.com/jmpews/Dobby.git /tmp/Dobby
        cd /tmp/Dobby

        # --- Build arm64 slice ---
        mkdir build_arm64 && cd build_arm64
        cmake .. \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_SYSTEM_PROCESSOR=arm64 \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
          -DCMAKE_BUILD_TYPE=Release \
          -DDOBBY_GENERATE_SHARED=OFF
        make -j$(sysctl -n hw.ncpu)
        cd ..

        # --- Build arm64e slice ---
        mkdir build_arm64e && cd build_arm64e
        cmake .. \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_ARCHITECTURES=arm64e \
          -DCMAKE_SYSTEM_PROCESSOR=arm64e \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
          -DCMAKE_BUILD_TYPE=Release \
          -DDOBBY_GENERATE_SHARED=OFF
        make -j$(sysctl -n hw.ncpu)
        cd ..

        # --- Tự động tìm file libdobby.a ---
        ARM64_LIB=$(find build_arm64 -name "libdobby.a" | head -n 1)
        ARM64E_LIB=$(find build_arm64e -name "libdobby.a" | head -n 1)

        # --- Ghép 2 slice thành universal binary và copy vào project ---
        mkdir -p "$GITHUB_WORKSPACE/vendor/dobby"
        lipo -create \
          "$ARM64_LIB" \
          "$ARM64E_LIB" \
          -output "$GITHUB_WORKSPACE/vendor/dobby/libdobby.a"
        cp include/dobby.h "$GITHUB_WORKSPACE/vendor/dobby/"

        echo "===> Dobby architectures:"
        lipo -info "$GITHUB_WORKSPACE/vendor/dobby/libdobby.a"

    - name: Compile and Package
      run: |
        export PATH="$(brew --prefix make)/libexec/gnubin:$THEOS/bin:$PATH"
        make package FINALPACKAGE=1

    - name: Collect Packages
      run: |
        mkdir -p artifacts
        find packages/ .theos/packages/ . -maxdepth 3 -name "*.deb" -exec cp -v {} artifacts/ \; 2>/dev/null || true
        echo "===> Built packages:"
        ls -la artifacts/
        if [ -z "$(ls -A artifacts/*.deb 2>/dev/null)" ]; then
          echo "Error: Không tìm thấy file .deb nào sau khi build!"
          exit 1
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: packages-deb
        path: artifacts/*.deb
        if-no-files-found: error
